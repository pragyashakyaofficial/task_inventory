<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nexus Inventory | Analytics Dashboard</title>
    <!-- Google Fonts + Font Awesome for professional icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f8;
            padding: 28px 24px;
            color: #1a2634;
        }

        .dashboard-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* header area */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            box-shadow: 0 6px 12px -6px rgba(0,0,0,0.1);
        }

        .brand-icon i {
            font-size: 26px;
            color: white;
        }

        .brand-text h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(120deg, #1f2b38, #2c3e50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-text p {
            font-size: 0.85rem;
            color: #5b6e8c;
            margin-top: 4px;
        }

        .refresh-btn {
            background: #2c5f8a;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .refresh-btn:hover {
            background: #1f4668;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(44,95,138,0.2);
        }

        /* stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 20px 20px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02), 0 8px 20px -8px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-info h3 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            color: #1e2f3e;
        }

        .stat-info p {
            font-size: 0.85rem;
            font-weight: 500;
            color: #6c7f8f;
            letter-spacing: 0.3px;
            margin-top: 6px;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            background: #f0f4f9;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .total-items .stat-icon { color: #2c7da0; background: #e6f2f7; }
        .in-stock .stat-icon { color: #2c9e6e; background: #e6f5ef; }
        .low-stock .stat-icon { color: #e6a017; background: #fef3e2; }
        .out-stock .stat-icon { color: #d9534f; background: #fce8e6; }
        .total-qty .stat-icon { color: #6f42c1; background: #f0eaff; }

        /* table panel */
        .table-panel {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 28px -12px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #edf2f7;
        }

        .panel-header {
            padding: 20px 28px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #ffffff;
        }

        .panel-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1f2a3e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .record-count {
            background: #ecfdf3;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1e7b4c;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 0 4px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 18px 20px;
            background: #fafcff;
            font-weight: 600;
            color: #2c3f5c;
            border-bottom: 1px solid #e9edf2;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f3f8;
            vertical-align: middle;
            color: #1f2c3e;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #fafcff;
        }

        .item-name {
            font-weight: 600;
            color: #1f2b38;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            width: fit-content;
        }

        .status-in-stock {
            background: #e3f7ec;
            color: #136b3a;
        }
        .status-low-stock {
            background: #fff0db;
            color: #b6560c;
        }
        .status-out-of-stock {
            background: #feeceb;
            color: #b33c34;
        }

        .loading-state, .error-msg, .empty-state {
            padding: 60px 48px;
            text-align: center;
            background: white;
        }

        .error-msg {
            color: #c2412c;
            background: #fff5f3;
            border-radius: 24px;
            margin: 20px;
        }

        .empty-state {
            color: #6c7f8f;
        }

        .fa-spinner {
            margin-right: 6px;
        }

        @media (max-width: 700px) {
            body { padding: 16px; }
            .stat-card { padding: 16px; }
            th, td { padding: 12px 16px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Header with brand and refresh button -->
    <div class="header-section">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-boxes"></i></div>
            <div class="brand-text">
                <h1>Nexus Inventory</h1>
                <p>Real-time analytics & stock insights</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="refresh-btn" onclick="loadDashboard()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid" id="statsContainer">
        <div class="stat-card total-items"><div class="stat-info"><h3 id="totalItems">-</h3><p>Total SKUs</p></div><div class="stat-icon"><i class="fas fa-cubes"></i></div></div>
        <div class="stat-card in-stock"><div class="stat-info"><h3 id="inStockCount">-</h3><p>In Stock</p></div><div class="stat-icon"><i class="fas fa-check-circle"></i></div></div>
        <div class="stat-card low-stock"><div class="stat-info"><h3 id="lowStockCount">-</h3><p>Low Stock</p></div><div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div></div>
        <div class="stat-card out-stock"><div class="stat-info"><h3 id="outOfStockCount">-</h3><p>Out of Stock</p></div><div class="stat-icon"><i class="fas fa-ban"></i></div></div>
        <div class="stat-card total-qty"><div class="stat-info"><h3 id="totalQuantity">-</h3><p>Total Units</p></div><div class="stat-icon"><i class="fas fa-warehouse"></i></div></div>
    </div>

    <!-- Inventory Table Panel -->
    <div class="table-panel">
        <div class="panel-header">
            <h2><i class="fas fa-clipboard-list"></i> Current Inventory</h2>
            <div class="record-count" id="recordCount">Loading...</div>
        </div>
        
        <div id="loadingMessage" class="loading-state">
            <i class="fas fa-spinner fa-pulse"></i> Fetching inventory data from database...
        </div>
        <div id="errorMessage" class="error-msg" style="display: none;"></div>
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-database" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
            <p>No inventory data found in the database.</p>
        </div>
        
        <div class="table-wrapper" id="tableWrapper" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Status</th>
                        <th>Last Updated</th>
                        <th>ID</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ============================================
    // READ-ONLY INVENTORY DASHBOARD
    // Fetches data from your actual database API
    // No CRUD operations - View only
    // ============================================
    
    // ========== API CONFIGURATION ==========
    // 🔧 UPDATE THIS URL WITH YOUR ACTUAL API ENDPOINT
    const API_BASE_URL = '/api';  // Change this to your API base URL
    const INVENTORY_ENDPOINT = `${API_BASE_URL}/dashboard`;  // Expects { stats: {}, items: [] }
    
    // Alternative endpoints (uncomment and modify as needed):
    // const INVENTORY_ENDPOINT = `${API_BASE_URL}/inventory`;
    // const INVENTORY_ENDPOINT = `${API_BASE_URL}/items`;
    
    // ========== Helper Functions ==========
    function getStockStatus(quantity) {
        if (quantity <= 0) return "Out of Stock";
        if (quantity < 10) return "Low Stock";
        return "In Stock";
    }
    
    function getStatusClass(status) {
        if (status === 'In Stock') return 'status-in-stock';
        if (status === 'Low Stock') return 'status-low-stock';
        return 'status-out-of-stock';
    }
    
    function getStatusIcon(status) {
        if (status === 'In Stock') return 'fa-check';
        if (status === 'Low Stock') return 'fa-exclamation';
        return 'fa-times';
    }
    
    function formatDate(dateValue) {
        if (!dateValue) return 'N/A';
        try {
            const date = new Date(dateValue);
            if (isNaN(date.getTime())) return 'N/A';
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        } catch (e) {
            return 'N/A';
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // ========== Display Functions ==========
    function displayStats(stats) {
        if (!stats) return;
        
        document.getElementById('totalItems').innerText = stats.totalItems ?? stats.totalCount ?? stats.count ?? 0;
        document.getElementById('inStockCount').innerText = stats.inStockCount ?? stats.in_stock ?? 0;
        document.getElementById('lowStockCount').innerText = stats.lowStockCount ?? stats.low_stock ?? 0;
        document.getElementById('outOfStockCount').innerText = stats.outOfStockCount ?? stats.out_of_stock ?? 0;
        document.getElementById('totalQuantity').innerText = stats.totalQuantity ?? stats.total_quantity ?? 0;
        
        const recordCountSpan = document.getElementById('recordCount');
        const total = stats.totalItems ?? stats.totalCount ?? stats.count ?? 0;
        recordCountSpan.innerHTML = `<i class="fas fa-database"></i> ${total} records`;
    }
    
    function displayItems(items) {
        const tbody = document.getElementById('itemsTableBody');
        tbody.innerHTML = '';
        
        if (!items || items.length === 0) {
            document.getElementById('tableWrapper').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            return;
        }
        
        items.forEach((item, index) => {
            const row = tbody.insertRow();
            const quantity = item.quantity ?? item.stock ?? item.qty ?? 0;
            const status = getStockStatus(quantity);
            
            // Item Name
            const nameCell = row.insertCell(0);
            nameCell.innerHTML = `<span class="item-name"><i class="fas fa-cube" style="color:#6c86a3; margin-right:8px;"></i>${escapeHtml(item.name ?? item.product_name ?? item.title ?? `Item ${index + 1}`)}</span>`;
            
            // Quantity
            row.insertCell(1).innerHTML = `<strong>${quantity}</strong>`;
            
            // Status Badge
            const statusCell = row.insertCell(2);
            statusCell.innerHTML = `<div class="status-badge ${getStatusClass(status)}"><i class="fas ${getStatusIcon(status)}"></i> ${status}</div>`;
            
            // Last Updated / Created Date
            const dateValue = item.updatedAt ?? item.updated_at ?? item.createdAt ?? item.created_at ?? item.last_updated;
            row.insertCell(3).innerText = formatDate(dateValue);
            
            // ID (for reference only - read-only)
            const idCell = row.insertCell(4);
            const itemId = item._id ?? item.id ?? item.uuid ?? 'N/A';
            idCell.innerHTML = `<code style="font-size: 0.75rem; color: #6c7f8f;">${escapeHtml(String(itemId).substring(0, 12))}${String(itemId).length > 12 ? '...' : ''}</code>`;
        });
    }
    
    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
        errorDiv.style.display = 'block';
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('tableWrapper').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';
    }
    
    function showLoading() {
        document.getElementById('loadingMessage').style.display = 'block';
        document.getElementById('tableWrapper').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';
    }
    
    // ========== API Fetch Functions ==========
    async function fetchInventoryData() {
        try {
            console.log('📡 Fetching inventory from:', INVENTORY_ENDPOINT);
            
            const response = await fetch(INVENTORY_ENDPOINT, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    // Add any authentication headers if needed:
                    // 'Authorization': `Bearer ${yourAuthToken}`,
                },
                // Add credentials if your API requires cookies/session:
                // credentials: 'include'
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log('✅ Data received:', data);
            
            // Handle different API response structures
            let stats = {};
            let items = [];
            
            if (data.stats && data.items) {
                // Standard format: { stats: {}, items: [] }
                stats = data.stats;
                items = data.items;
            } else if (data.data && data.data.stats && data.data.items) {
                // Nested format: { data: { stats: {}, items: [] } }
                stats = data.data.stats;
                items = data.data.items;
            } else if (Array.isArray(data)) {
                // Direct array of items
                items = data;
                // Calculate stats from items
                stats = calculateStatsFromItems(items);
            } else if (data.items && Array.isArray(data.items)) {
                // { items: [] } format
                items = data.items;
                stats = data.stats || calculateStatsFromItems(items);
            } else {
                // Try to extract whatever we can
                items = data.items || data.data || [];
                stats = data.stats || calculateStatsFromItems(items);
            }
            
            return { stats, items };
            
        } catch (error) {
            console.error('API Error:', error);
            throw error;
        }
    }
    
    // Fallback: calculate stats from items array if API doesn't provide stats
    function calculateStatsFromItems(items) {
        let totalItems = items.length;
        let inStockCount = 0;
        let lowStockCount = 0;
        let outOfStockCount = 0;
        let totalQuantity = 0;
        
        items.forEach(item => {
            const qty = item.quantity ?? item.stock ?? item.qty ?? 0;
            totalQuantity += qty;
            
            if (qty <= 0) outOfStockCount++;
            else if (qty < 10) lowStockCount++;
            else inStockCount++;
        });
        
        return { totalItems, inStockCount, lowStockCount, outOfStockCount, totalQuantity };
    }
    
    // ========== Main Load Function ==========
    async function loadDashboard() {
        showLoading();
        
        try {
            const { stats, items } = await fetchInventoryData();
            displayStats(stats);
            displayItems(items);
            
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('tableWrapper').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            
            // Update last refresh time in console
            console.log(`🔄 Dashboard refreshed at ${new Date().toLocaleTimeString()}`);
            
        } catch (err) {
            console.error('Failed to load inventory:', err);
            
            let errorMessage = 'Unable to connect to the inventory database. ';
            
            if (err.message.includes('Failed to fetch')) {
                errorMessage += 'Please check if your API server is running and the endpoint is correct.';
            } else if (err.message.includes('HTTP')) {
                errorMessage += `Server error: ${err.message}`;
            } else {
                errorMessage += err.message;
            }
            
            errorMessage += `\n\nCurrent endpoint: ${INVENTORY_ENDPOINT}\n\nMake sure to update the API_BASE_URL variable to match your backend.`;
            
            showError(errorMessage);
        }
    }
    
    // ========== Auto-refresh (optional) ==========
    let refreshInterval = null;
    
    function startAutoRefresh(intervalMs = 30000) {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            console.log('Auto-refreshing inventory data...');
            loadDashboard();
        }, intervalMs);
    }
    
    function stopAutoRefresh() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
    }
    
    // ========== Initialize Dashboard ==========
    document.addEventListener('DOMContentLoaded', () => {
        loadDashboard();
        // Uncomment to enable auto-refresh every 30 seconds:
        // startAutoRefresh(30000);
    });
    
    // Make functions available globally for console debugging
    window.loadDashboard = loadDashboard;
    window.stopAutoRefresh = stopAutoRefresh;
    window.startAutoRefresh = startAutoRefresh;
    
    // Display API endpoint info in console
    console.log(`
╔══════════════════════════════════════════════════════════╗
║     NEXUS INVENTORY DASHBOARD                            ║
╠══════════════════════════════════════════════════════════╣
║  API Endpoint: ${INVENTORY_ENDPOINT}
║  Status: Fetching data from your database
║  CRUD Operations: DISABLED (View Only)
║                                                          ║
║  To connect to your API:                                 ║
║  1. Update API_BASE_URL variable in the script           ║
║  2. Ensure your endpoint returns: { stats, items }       ║
╚══════════════════════════════════════════════════════════╝
    `);
</script>
</body>
</html>
